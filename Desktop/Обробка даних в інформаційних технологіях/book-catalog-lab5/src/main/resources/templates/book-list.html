<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Каталог Книг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="d-flex justify-content-between mb-4">
    <h2>Каталог книг (Spring MVC)</h2>
    <a th:href="@{/books/add}" class="btn btn-primary">Додати книгу</a>
</div>

<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th>Назва</th>
        <th>Автор</th>
        <th>Опис</th>
        <th>Дії</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.title}">Назва</td>
        <td th:text="${book.author}">Автор</td>
        <td th:text="${book.description}">Опис</td>
        <td>
        </td>
        <td>
            <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning btn-sm">Редагувати</a>

            <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-danger btn-sm">Видалити</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
