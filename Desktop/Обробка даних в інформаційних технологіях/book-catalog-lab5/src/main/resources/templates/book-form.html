<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Додати книгу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Додати нову книгу</h2>

<form th:action="@{/books/save}" th:object="${book}" method="post" class="mt-4">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
        <label class="form-label">Назва книги</label>
        <input type="text" th:field="*{title}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Автор</label>
        <input type="text" th:field="*{author}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Опис</label>
        <input type="text" th:field="*{description}" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Посилання на картинку</label>
        <input type="text" th:field="*{imageUrl}" class="form-control">
    </div>


    <button type="submit" class="btn btn-success">Зберегти</button>
    <a th:href="@{/books}" class="btn btn-outline-secondary">Скасувати</a>
</form>
</body>
</html>
